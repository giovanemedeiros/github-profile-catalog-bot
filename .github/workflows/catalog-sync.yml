name: GitHub Profile & Inventory Catalog Sync

on:
  workflow_dispatch:
  # NOTE: Native GitHub Actions 'schedule' (cron) events are placed in a low-priority shared queue
  # that can experience multi-hour delays during peak loads. To guarantee strict execution within
  # the 03:00-04:00 BRT maintenance window, this workflow is triggered via the GitHub REST API
  # ('workflow_dispatch' high-priority queue) using Google Apps Script (see scripts/gas-trigger.template.js)
  # or any compatible external cron scheduler.
  # Uncomment the 'schedule' block below if you prefer native GitHub Actions cron scheduling:
  # schedule:
  #   - cron: "17 6 * * *"

jobs:
  sync-catalog:
    name: Sync Profile and Inventory Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Execute Catalog Bot
        run: npm run dev
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || 'giovanemedeiros' }}
          INVENTORY_REPO_NAME: ${{ vars.INVENTORY_REPO_NAME || 'github-profile-inventory' }}
